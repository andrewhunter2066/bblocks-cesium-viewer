"$schema": https://json-schema.org/draft/2020-12/schema
title: Georeferenced topo-feature document
description: |
  The minimum the Globe view needs to place a topo-feature document: a `points` collection. This is
  a demo block for the view, not a topo-feature schema; see
  https://github.com/ogcincubator/topo-feature for the data model itself.
type: object
required: [points]
properties:
  points:
    type: array
    minItems: 1

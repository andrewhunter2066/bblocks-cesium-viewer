"$schema": https://json-schema.org/draft/2020-12/schema
title: Cesium globe viewer configuration
description: |
  Per-block configuration for the TopoFeatureCesiumPlugin, the bblocks-viewer "Globe" view of
  topo-feature documents. A block declares it as a `resources` entry in its `bblock.json` with the
  role `https://github.com/ogcincubator/bblocks-cesium-viewer/role/viewer-config`.

  `rules`, `defaults` and `kindOrder` are the rule-engine configuration shared with the Three.js
  TopoFeaturePlugin (bblocks-viewer-topo-feature-plugin); `cesium` holds the globe-only options.
  Every member is optional: an omitted `rules` keeps the plugin's built-in rules.
type: object
additionalProperties: false
properties:
  rules:
    description: |
      Ordered rules. For each feature, the first rule whose `source` is the collection it came from
      and whose `match` (if any) applies decides how it is drawn; a feature no rule claims is not
      drawn. A non-empty list replaces the built-in rules entirely.
    type: array
    items:
      $ref: "#/$defs/rule"
  defaults:
    description: Defaults merged under every rule; `style` is merged key by key.
    type: object
    additionalProperties: false
    properties:
      style:
        $ref: "#/$defs/style"
      elevation:
        $ref: "#/$defs/elevation"
  kindOrder:
    description: Preferred order of kinds, for viewers that list them.
    type: array
    items:
      type: string
  cesium:
    $ref: "#/$defs/cesiumOptions"

$defs:
  rule:
    type: object
    additionalProperties: false
    required: [source, kind, geometry]
    properties:
      source:
        description: |
          Top-level collection of the document to classify, e.g. `solids`, `parcels`, `faces`,
          `rings`, or the derived `surfaces` (shells no solid uses).
        type: string
        minLength: 1
      kind:
        description: Identifier grouping this rule's features, e.g. `parcel-created`.
        type: string
        minLength: 1
      group:
        description: Groups several kinds under one heading and toggle. Defaults to `kind`.
        type: string
        minLength: 1
      kindLabel:
        description: Human-readable name for this kind, e.g. `Former Tenure`.
        type: string
      geometry:
        description: How the feature's topology is turned into a shape.
        enum: [solid, open-shell, polygon, face, ring]
      match:
        description: |
          Restricts the rule to features whose property value (or any value, for an array) equals
          one of `values`. Values may be literals, CURIEs expanded against the document's own
          `@context`, or full URIs; both sides are expanded before comparing.
        type: object
        additionalProperties: false
        required: [property, values]
        properties:
          property:
            description: Dot-separated path into the feature, e.g. `properties.parcelState`.
            type: string
            minLength: 1
          values:
            type: array
            minItems: 1
            items:
              type: string
      label:
        description: |
          Where a feature's label comes from: the first of `properties` (dot-separated paths) that
          resolves to a non-empty value or to an object with a string `label`, else `fallback`
          (default `id`).
        type: object
        additionalProperties: false
        properties:
          properties:
            type: array
            items:
              type: string
          fallback:
            type: string
      style:
        $ref: "#/$defs/style"
      initiallyVisible:
        description: Whether the feature is shown when the view opens. Default true.
        type: boolean
      elevation:
        $ref: "#/$defs/elevation"

  style:
    type: object
    additionalProperties: false
    properties:
      color:
        description: Fill colour, any CSS colour (e.g. `#a1531a`). Default cycles a palette.
        type: string
      opacity:
        description: Fill opacity, 0 (transparent) to 1 (opaque).
        type: number
        minimum: 0
        maximum: 1
      lineColor:
        description: Outline colour, any CSS colour. Default white.
        type: string
      lineStyle:
        enum: [solid, dashed]

  elevation:
    description: |
      `preserve` (default) keeps each point's height; `flatten` clamps the feature to the ground
      (terrain, or the ellipsoid); `{ "flattenTo": n }` places it n metres above the ellipsoid.
    oneOf:
      - enum: [preserve, flatten]
      - type: object
        additionalProperties: false
        required: [flattenTo]
        properties:
          flattenTo:
            type: number

  cesiumOptions:
    description: |
      Globe-only options. Everything works without an ion token: the default is OpenStreetMap
      imagery on the flat WGS84 ellipsoid.
    type: object
    additionalProperties: false
    properties:
      basemap:
        description: |
          `osm` (default), `ion` (Cesium ion world imagery; needs `ionToken`), or an XYZ tile
          template served over https with `{z}`, `{x}` and `{y}` placeholders.
        oneOf:
          - enum: [osm, ion]
          - type: object
            additionalProperties: false
            required: [url]
            properties:
              url:
                type: string
                pattern: "^(?=.*\\{z\\})(?=.*\\{x\\})(?=.*\\{y\\})https://"
              credit:
                description: Attribution shown on the globe; required by most tile providers.
                type: string
              maximumLevel:
                description: Deepest zoom level the tile server has.
                type: integer
                minimum: 0
      terrain:
        description: "`ellipsoid` (default, flat) or `ion` (Cesium World Terrain; needs `ionToken`)."
        enum: [ellipsoid, ion]
      camera:
        description: Initial view. Without it, the view frames the document's features.
        type: object
        additionalProperties: false
        required: [longitude, latitude, height]
        properties:
          longitude:
            type: number
            minimum: -180
            maximum: 180
          latitude:
            type: number
            minimum: -90
            maximum: 90
          height:
            description: Metres above the ellipsoid.
            type: number
          heading:
            description: Degrees clockwise from north. Default 0.
            type: number
          pitch:
            description: Degrees; negative looks down. Default -45.
            type: number
            minimum: -90
            maximum: 90
          roll:
            description: Degrees. Default 0.
            type: number
      ionToken:
        description: |
          Cesium ion access token, used only by `ion` imagery or terrain. Never commit one: a
          published register injects it at build time from a CI secret. It is visible to anyone
          using the viewer, so it must be scoped to `assets:read` and restricted to the register's
          domain.
        type: string

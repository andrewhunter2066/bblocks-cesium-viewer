name: CI

# Plugin checks plus a secret scan on every push and PR. The building blocks themselves are
# validated separately by pr-check.yml / process-bblocks.yml.
on:
  push:
    branches-ignore: [dist]
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    name: Test and build plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # scan the full history, not just the tip

      # The gitleaks CLI image rather than gitleaks-action, which needs a paid licence once the
      # repo moves to an organisation. Its default rules include JWTs such as Cesium ion tokens.
      - name: Scan for committed secrets
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1

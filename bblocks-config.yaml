# A short, descriptive name of this building block collection
name: Cesium globe viewer for topo-feature documents

# Short abstract for this collection (optional)
abstract: |
  A CesiumJS **Globe** view for topo-feature topology documents in the Building Blocks viewer, the
  JSON Schema for its per-block configuration, and demo blocks that use it.

# Description for this collection (optional)
description: |
  The `TopoFeatureCesiumPlugin` is a [bblocks-viewer](https://github.com/opengeospatial/bblocks-viewer)
  view plugin. It adds a **Globe** tab to any example or transform output that is a
  [topo-feature](https://github.com/ogcincubator/topo-feature) document whose points carry WGS84
  `geometry`, drawing its solids, surfaces, faces and parcels at their real positions on a
  CesiumJS globe — OpenStreetMap on the flat ellipsoid by default, with no Cesium ion token needed.

  Which features are drawn and how is set by rules shared with the Three.js topology view
  ([bblocks-viewer-topo-feature-plugin](https://github.com/ogcincubator/bblocks-viewer-topo-feature-plugin)),
  optionally configured per block; see the *Cesium globe viewer configuration* block. This register
  declares the plugin itself, so the demo blocks' examples open in the Globe tab here.

  Source, harness and instructions for adding the plugin to another register:
  [bblocks-cesium-viewer](https://github.com/andrewhunter2066/bblocks-cesium-viewer).

# Customize the following prefix (will be prepended to the path of the building blocks):
identifier-prefix: ogc.bbr.template.

# List of imports ("default" is an alias for the main OGC Building Blocks Register).
# An entry can also be an "@org/register" alias (e.g. "@ogc/main", equivalent to "default"),
# resolved against a Building Blocks meta-registry -- see "meta-registry" below -- instead of
# a full register.json URL.
imports:
  - default

# Meta-registry used to resolve "@org/register" import aliases above (optional).
# Defaults to the postprocessor's built-in meta-registry if omitted; set to null to disable
# alias resolution entirely (any "@org/register" import will then fail).
#
# meta-registry: https://w3id.org/ogc/bblocks/meta-register.json

# Whether to enable the (highly experimental) downcompiling of JSON schemas to an OpenAPI 3.0-compatible
# version
schema-oas30-downcompile: False

# Default license for this register and all of its building blocks (optional).
# At least one of "name"/"url" is required. A building block can override this by declaring its own
# "license" in its bblock.json.
# If "url" is left unspecified and a LICENSE, LICENSE.md or LICENSE.txt file exists at the repository
# root, its published URL is used automatically.
#
# license:
#   name: Apache-2.0
#   url: https://www.apache.org/licenses/LICENSE-2.0

# Viewer configuration (optional)
viewer:
  view-plugins:
    # This repository's own plugin (dogfooding), published from the `dist` branch by
    # .github/workflows/publish-dist.yml. Moves to ogcincubator/bblocks-cesium-viewer with the repo.
    # For local testing, `npm run local-register` points build-local/register.json at the local
    # build instead (see README).
    - url: https://cdn.jsdelivr.net/gh/andrewhunter2066/bblocks-cesium-viewer@dist/index.js
      export: TopoFeatureCesiumPlugin

# SPARQL configuration (optional)
#   Authentication can be set through the sparql_username and sparql_password GitHub Workflow inputs
#   (see .github/workflow/process-bblocks.yml)
#
# sparql:
#   push: https://example.com/gsp           # SPARQL Graph Store Protocol endpoint for uploading data
#   graph: https://my.bblocks.example.com/  # SPARQL Graph where data will be uploaded
#                                           #  if left empty, the base URL for the publication will be used
#   query: https://example.com/sparql       # SPARQL query endpoint where data will be available
#   resources:                              # Additional resources to upload apart from building block metadata
#      ontologies: true                     #   Whether to upload ontology files to the triplestore

# External transformer/validator plugins (optional)
#   Each entry installs its pip dependencies into a sandbox and imports the given modules,
#   which are scanned for plugin classes. Unless the postprocessor is run with
#   --skip-permissions=true, you will be prompted before plugin code is installed/run.
#
# plugins:
#   transforms:
#     - modules: [my.custom.Transformer]     # Dotted Python module path(s) to import
#       pip: [my-custom-package]             # pip install specifier(s) for the module(s)
#       url: https://example.com/my-plugin   # Optional: plugin homepage/repo (auto-derived from pip if omitted)
#   validators:
#     - modules: [my.custom.Validator]
#       pip: [my-custom-package]
#   build:                                   # Lifecycle-hook plugins (before_run, before/after_bblock,
#                                             #   after_register, after_uplift, after_run, on_error),
#                                             #   run locally and in CI alike.
#     - classes: [my.custom.BuildHooks]      # Fully-qualified module.ClassName(s) - used exactly as
#                                             #   given, not scanned like transforms/validators' "modules"
#       pip: [my-custom-package]
#       url: https://example.com/my-plugin